<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLog — Тренувальний Щоденник</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #95a5a6;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 28px;
        }

        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        /* Перемикач днів (День А / День Б) */
        .day-switcher {
            display: flex;
            background-color: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .add-exercise-panel {
            background-color: var(--card-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        select, .btn-main {
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        select {
            flex-grow: 1;
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #444;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-title {
            font-size: 18px;
            font-weight: bold;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        .btn-info {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .exercise-visual {
            display: none;
            text-align: center;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #111;
        }

        .exercise-visual img {
            max-width: 100%;
            height: auto;
            max-height: 220px;
            display: block;
            margin: 0 auto;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .sets-table th {
            color: var(--text-muted);
            font-size: 12px;
            text-align: left;
            padding-bottom: 8px;
        }

        .set-row {
            border-top: 1px solid #2d2d2d;
        }

        .set-row td {
            padding: 8px 0;
        }

        .input-field {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            width: 55px;
            text-align: center;
            font-size: 14px;
        }

        .btn-check {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            min-width: 65px;
        }

        .btn-check.done {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .btn-add-set {
            background: none;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            width: 100%;
            padding: 6px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 2px solid var(--accent-color);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .timer-display {
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
        }
        
        .timer-display.alarm {
            color: var(--danger-color);
            animation: blink 1s infinite;
        }

        .timer-btn {
            background-color: var(--accent-color);
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear-all {
            background-color: #333;
            color: var(--text-muted);
            border: 1px solid #444;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PowerLog</h1>
            <p>Твій мобільний тренувальний щоденник</p>
        </header>

        <!-- Вкладки для перемикання днів тренувань -->
        <div class="day-switcher">
            <button id="btnDayA" class="tab-btn active" onclick="switchDay('dayA')">День А</button>
            <button id="btnDayB" class="tab-btn" onclick="switchDay('dayB')">День Б</button>
        </div>

        <div class="add-exercise-panel">
            <select id="exerciseSelect">
                <!-- Оновлена якісна база базових вправ -->
                <optgroup label="Груди, Плечі, Руки">
                    <option value="db_press">Жим гантелей лежачи</option>
                    <option value="db_overhead_press">Жим гантелей сидячи (вгору)</option>
                    <option value="db_biceps">Підйом гантелей на біцепс</option>
                    <option value="pushups">Віджимання від підлоги</option>
                </optgroup>
                <optgroup label="Спина та Коре">
                    <option value="db_rows">Тяга гантелі в нахилі</option>
                    <option value="plank">Планка (секунди у повторах)</option>
                </optgroup>
                <optgroup label="Ноги">
                    <option value="bb_squat">Присідання зі штангою</option>
                    <option value="db_lunges">Випади з гантелями</option>
                    <option value="bb_deadlift">Станова тяга зі штангою</option>
                </optgroup>
            </select>
            <button class="btn-main" onclick="addExercise()">+ Додати</button>
        </div>

        <div id="workoutContainer"></div>
        
        <button class="btn-clear-all" onclick="clearCurrentDay()">Очистити цей день</button>
    </div>

    <div class="timer-panel">
        <div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Відпочинок</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>
        <button class="timer-btn" onclick="startTimer(60)">60 с</button>
        <button class="timer-btn" onclick="startTimer(90)">90 с</button>
        <button class="timer-btn" style="background-color: #333;" onclick="stopTimer()">Стоп</button>
    </div>

    <script>
        // Розширена база з точними якісними фітнес-зображеннями
        const exerciseDB = {
            db_press: { title: "Жим гантелей лежачи", img: "https://images.unsplash.com/photo-1605296867304-46d5465a25f1?w=500&q=80" },
            db_overhead_press: { title: "Жим гантелей сидячи", img: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=500&q=80" },
            db_biceps: { title: "Підйом гантелей на біцепс", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&q=80" },
            pushups: { title: "Віджимання від підлоги", img: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=500&q=80" },
            db_rows: { title: "Тяга гантелі в нахилі", img: "https://images.unsplash.com/photo-1434682881908-b43d0467b798?w=500&q=80" },
            plank: { title: "Планка", img: "https://images.unsplash.com/photo-1566241477600-ac026ad43874?w=500&q=80" },
            bb_squat: { title: "Присідання зі штангою", img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&q=80" },
            db_lunges: { title: "Випади з гантелями", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80" },
            bb_deadlift: { title: "Станова тяга зі штангою", img: "https://images.unsplash.com/photo-1517838448704-a3291058e04e?w=500&q=80" }
        };

        let timerInterval = null;
        let currentDay = 'dayA'; // Поточний вибраний день за замовчуванням
        
        // Глобальна структура для збереження обох днів
        let globalState = {
            dayA: [],
            dayB: []
        };

        window.onload = function() {
            const savedData = localStorage.getItem('powerLogGlobalState');
            if (savedData) {
                globalState = JSON.parse(savedData);
                // Захист на випадок старих форматів збереження
                if (!globalState.dayA) globalState.dayA = [];
                if (!globalState.dayB) globalState.dayB = [];
            }
            renderState();
        };

        function saveToLocalStorage() {
            localStorage.setItem('powerLogGlobalState', JSON.stringify(globalState));
        }

        // Перемикання вкладок
        function switchDay(dayKey) {
            currentDay = dayKey;
            
            // Зміна активного класу на кнопках
            document.getElementById('btnDayA').classList.toggle('active', dayKey === 'dayA');
            document.getElementById('btnDayB').classList.toggle('active', dayKey === 'dayB');
            
            renderState();
        }

        function addExercise() {
            const select = document.getElementById('exerciseSelect');
            const exerciseKey = select.value;
            
            const newExercise = {
                id: 'ex_' + Date.now(),
                key: exerciseKey,
                showVisual: false,
                sets: [{ weight: 20, reps: 10, done: false }]
            };

            globalState[currentDay].push(newExercise);
            saveToLocalStorage();
            renderState();
        }

        function removeExercise(id) {
            globalState[currentDay] = globalState[currentDay].filter(ex => ex.id !== id);
            saveToLocalStorage();
            renderState();
        }

        function addSet(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                const lastSet = exercise.sets[exercise.sets.length - 1];
                exercise.sets.push({
                    weight: lastSet ? lastSet.weight : 20,
                    reps: lastSet ? lastSet.reps : 10,
                    done: false
                });
                saveToLocalStorage();
                renderState();
            }
        }

        function updateSetData(exerciseId, setIndex, field, value) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex][field] = parseFloat(value) || value;
                saveToLocalStorage();
            }
        }

        function toggleVisual(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                exercise.showVisual = !exercise.showVisual;
                saveToLocalStorage();
                renderState();
            }
        }

        function toggleSetDone(exerciseId, setIndex) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex].done = !exercise.sets[setIndex].done;
                saveToLocalStorage();
                renderState();

                if (exercise.sets[setIndex].done) {
                    startTimer(90); // Автовідпочинок 90 сек
                }
            }
        }

        function clearCurrentDay() {
            if (confirm(`Очистити всі вправи для шаблону ${currentDay === 'dayA' ? 'День А' : 'День Б'}?`)) {
                globalState[currentDay] = [];
                saveToLocalStorage();
                renderState();
                stopTimer();
            }
        }

        function renderState() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            const currentExercises = globalState[currentDay] || [];

            if (currentExercises.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:30px; font-size:14px; border: 1px dashed #333; padding: 20px; border-radius: 8px;">Шаблон порожній.<br>Обери вправу вгорі та натисни "+ Додати" для формування програми.</div>`;
                return;
            }

            currentExercises.forEach(ex => {
                const dbData = exerciseDB[ex.key];
                if (!dbData) return;
                
                let setsHTML = '';
                ex.sets.forEach((set, index) => {
                    setsHTML += `
                        <tr class="set-row">
                            <td>${index + 1}</td>
                            <td><input type="number" class="input-field" value="${set.weight}" onchange="updateSetData('${ex.id}', ${index}, 'weight', this.value)"></td>
                            <td><input type="number" class="input-field" value="${set.reps}" onchange="updateSetData('${ex.id}', ${index}, 'reps', this.value)"></td>
                            <td style="text-align: right;">
                                <button class="btn-check ${set.done ? 'done' : ''}" onclick="toggleSetDone('${ex.id}', ${index})">
                                    ${set.done ? '✓' : 'Done'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                const cardHTML = `
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <span class="exercise-title">${dbData.title}</span>
                            <div>
                                <button class="btn-delete" onclick="removeExercise('${ex.id}')">🗑️</button>
                                <button class="btn-info" onclick="toggleVisual('${ex.id}')">?</button>
                            </div>
                        </div>

                        <div class="exercise-visual" style="display: ${ex.showVisual ? 'block' : 'none'}">
                            <img src="${dbData.img}" alt="${dbData.title}">
                        </div>

                        <table class="sets-table">
                            <thead>
                                <tr>
                                    <th>Сет</th>
                                    <th>Вага</th>
                                    <th>Повтори</th>
                                    <th style="text-align: right;">Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${setsHTML}
                            </tbody>
                        </table>
                        <button class="btn-add-set" onclick="addSet('${ex.id}')">+ Додати підхід</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Таймер зворотного відліку
        function startTimer(seconds) {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            
            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    display.classList.add('alarm');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            display.innerText = "00:00";
        }

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
