<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PowerLog Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PowerLog Pro">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 120px;
        }
        
        header {
            padding-top: calc(env(safe-area-inset-top, 20px) + 12px) !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .progress-bar-fill {
            transition: width 0.3s ease-in-out;
        }

        optgroup {
            background-color: #161b22;
            color: #22d3ee;
            font-weight: bold;
        }
        option {
            background-color: #0d1117;
            color: #ffffff;
            font-weight: normal;
        }
    </style>
</head>
<body class="max-w-md mx-auto px-4">

    <!-- HEADER -->
    <header class="flex justify-between items-center mb-3 pb-2 border-b border-gray-800">
        <div>
            <h1 class="text-xl font-black text-cyan-400 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-dumbbell"></i> POWERLOG <span class="text-[10px] bg-cyan-400 text-black px-1.5 py-0.5 rounded font-bold">PRO</span>
            </h1>
        </div>
        <div class="flex space-x-3 text-sm">
            <button onclick="exportData()" class="text-gray-400 hover:text-white" title="Експорт"><i class="fa-solid fa-download"></i></button>
            <button onclick="importData()" class="text-gray-400 hover:text-white" title="Імпорт"><i class="fa-solid fa-upload"></i></button>
            <button onclick="resetData()" class="text-red-500 hover:text-red-400" title="Скинути дані"><i class="fa-solid fa-trash-can"></i></button>
        </div>
    </header>

    <!-- ПРОГРЕС ТРЕНУВАННЯ -->
    <section class="bg-gray-900/80 border border-gray-800 p-3 rounded-2xl mb-4">
        <div class="flex justify-between items-center text-xs mb-1.5">
            <span class="text-gray-400 font-medium">Прогрес тренування</span>
            <span id="workout-progress-text" class="text-cyan-400 font-bold font-mono">0% (0/0)</span>
        </div>
        <div class="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800/80">
            <div id="workout-progress-bar" class="bg-cyan-400 h-full rounded-full progress-bar-fill" style="width: 0%"></div>
        </div>
        <div class="flex justify-between items-center text-[10px] text-gray-500 mt-2 pt-1 border-t border-gray-800/40">
            <span>Загальний тоннаж: <strong id="total-volume" class="text-gray-300 font-mono">0 кг</strong></span>
            <span id="active-day-title" class="text-cyan-400 font-semibold">День не обрано</span>
        </div>
    </section>

    <!-- ТАБИ ДНІВ -->
    <section class="mb-4">
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1" id="days-tabs"></div>
    </section>

    <!-- ДИСПЕТЧЕР ВПРАВ В ДНІ (100% АДАПТИВНИЙ) -->
    <section class="bg-gray-900/60 border border-gray-800 p-3 rounded-2xl mb-4 space-y-2.5">
        <div class="w-full">
            <select id="exercise-select" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400 truncate"></select>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
            <button onclick="addExerciseToDay()" class="bg-cyan-400 hover:bg-cyan-300 active:scale-95 text-black font-bold py-2.5 px-2 rounded-xl text-xs transition text-center shadow-lg shadow-cyan-400/10">
                + Додати в день
            </button>
            <button onclick="openNewExerciseModal()" class="bg-gray-950 hover:bg-gray-800 active:scale-95 border border-gray-800 text-cyan-400 font-semibold py-2.5 px-2 rounded-xl text-xs transition text-center">
                + Створити нову
            </button>
        </div>
    </section>

    <!-- СПИСОК ВПРАВ ТРЕНУВАННЯ -->
    <main id="workout-exercises-list" class="space-y-4 mb-6"></main>

    <!-- ТАЙМЕР ВІДПОЧИНКУ (ФІКСОВАНИЙ) -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-gray-950/95 backdrop-blur-md border-t border-gray-800 pb-[calc(env(safe-area-inset-bottom,16px)+10px)] z-40">
        <div class="flex justify-between items-center">
            <div>
                <span class="text-[9px] text-gray-500 uppercase tracking-wider block font-bold">Відпочинок</span>
                <span id="timer-display" class="text-xl font-black font-mono text-cyan-400">00:00</span>
            </div>
            <div class="flex space-x-1.5">
                <button onclick="startTimer(60)" class="px-3 py-2 bg-gray-900 border border-gray-800 hover:border-gray-700 text-xs font-semibold rounded-xl text-gray-300">60 с</button>
                <button onclick="startTimer(90)" class="px-3 py-2 bg-gray-900 border border-gray-800 hover:border-gray-700 text-xs font-semibold rounded-xl text-gray-300">90 с</button>
                <button onclick="stopTimer()" class="px-3 py-2 bg-gray-900 border border-gray-800 text-xs font-semibold rounded-xl text-red-400">Стоп</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НОВОЇ ВПРАВИ -->
    <div id="exercise-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">Створити вправу в базу</h3>
                <button onclick="closeNewExerciseModal()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="text" id="new-ex-name" placeholder="Назва вправи (наприклад: Гоккен-присідання)" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 px-3 text-xs text-white focus:outline-none focus:border-cyan-400">
            <textarea id="new-ex-desc" placeholder="Опис техніки / підказка (необов'язково)" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 px-3 text-xs text-white focus:outline-none focus:border-cyan-400 h-24"></textarea>
            <button onclick="createNewExercise()" class="w-full bg-cyan-400 text-black font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Зберегти у базу</button>
        </div>
    </div>

    <!-- МОДАЛКА ПІДКАЗКИ -->
    <div id="info-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 id="info-modal-title" class="text-sm font-bold text-cyan-400"></h3>
                <button onclick="closeInfoModal()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="info-modal-body" class="text-xs text-gray-300 leading-relaxed whitespace-pre-wrap"></p>
        </div>
    </div>

    <script>
        // === СИСТЕМАТИЗОВАНА БАЗА ВПРАВ ЗА КАТЕГОРІЯМИ ===
        const initialExerciseBase = [
            // --- НОГИ ТА СІДНИЦІ ---
            { id: 'ex_t1_1', category: 'Ноги та сідниці', name: 'Випади на одній нозі', desc: 'План: 3 х 10-12.\nТехніка: Крок уперед, опускай таз вертикально до кута 90° у колінах. Коліно попереду не виходить за носок.' },
            { id: 'ex_t1_2', category: 'Ноги та сідниці', name: 'Присідання з гантелями', desc: 'План: 3 х 8-10.\nТехніка: Тримай гантелі в опущених руках або біля плечей. Спина рівна, п\'яти не відривай від підлоги.' },
            { id: 'ex_t2_1', category: 'Ноги та сідниці', name: 'Присідання сумо з гантеллю', desc: 'План: 4 х 10.\nТехніка: Широка постановка ніг, носки в сторони. Тримай гантель між ніг і присідай глибоко.' },
            { id: 'ex_t2_5', category: 'Ноги та сідниці', name: 'Румунська тяга (на прямих ногах)', desc: 'План: 4 х 10-12.\nТехніка: Ноги майже прямі, таз відводь назад, нахиляйся із прямою спиною до відчуття розтягування біцепса стегна.' },

            // --- СПИНА ---
            { id: 'ex_t1_8', category: 'Спина', name: 'Тяга штанги/гантелей до пояса', desc: 'План: 4 х 12-15.\nТехніка: Нахил тулуба 45°, спина прогнута. Тягни вагу уздовж стегон до низу живота за рахунок м\'язів спини.' },
            { id: 'ex_t2_7', category: 'Спина', name: 'Тяга гантелі однією рукою в нахилі', desc: 'План: 4 х 12-15.\nТехніка: Упор коліном і рукою на лаву. Тягни гантель до пояса, зводячи лопатку.' },
            { id: 'ex_t1_3', category: 'Спина', name: 'Шраги з гантелями (трапеції)', desc: 'План: 3 х 8-10.\nТехніка: Руки прямі вздовж тулуба. Піднімай плечі максимально вгору до вух без згинання ліктів.' },

            // --- ПЛЕЧІ ТА ГРУДИ ---
            { id: 'ex_t1_4', category: 'Плечі та Груди', name: 'Жим гантелей сидячи (плечі)', desc: 'План: 3 х 10-12.\nТехніка: Сидячи рівно, витискай гантелі вгору над головою до майже повного розпрямлення ліктів.' },
            { id: 'ex_t1_5', category: 'Плечі та Груди', name: 'Жим гантелей лежачи (груди)', desc: 'План: 4 х 10-12.\nТехніка: Лежачи на лаві або підлозі, зводи лопатки і тисни гантелі вгору над грудьми.' },
            { id: 'ex_t1_6', category: 'Плечі та Груди', name: 'Віджимання від підлоги', desc: 'План: 4 х 30-25-25-20.\nТехніка: Тіло — пряма лінія. Опускайся до торкання грудьми підлоги, лікті під кутом 45° до тулуба.' },
            { id: 'ex_t2_2', category: 'Плечі та Груди', name: 'Підйом гантелей перед собою', desc: 'План: 4 х 12-15.\nТехніка: Піднімай прямі (або трохи зігнуті) руки з гантелями до рівня очей перед собою.' },
            { id: 'ex_t2_3', category: 'Плечі та Груди', name: 'Махи гантелями в сторони (середня дельта)', desc: 'План: 4 х 12-15.\nТехніка: Підйом гантелей через сторони до рівня плечей. Лікті трохи вище за кисті.' },
            { id: 'ex_t2_4', category: 'Плечі та Груди', name: 'Тяга штанги/гантелей до підборіддя ("Вертоліт")', desc: 'План: 4 х 10.\nТехніка: Вузький або середній хват. Тягни вагу вгору уздовж тулуба, піднімаючи лікті вище плечей.' },
            { id: 'ex_t2_6', category: 'Плечі та Груди', name: 'Розведення гантелей лежачи', desc: 'План: 4 х 10-12.\nТехніка: Лежачи на лаві, розводь трохи зігнуті руки в сторони до рівня грудей та зводь назад.' },
            { id: 'ex_alt_1', category: 'Плечі та Груди', name: 'Жим гантелей на похилій лаві', desc: 'Опрацювання верхньої частини грудей. Кут лави 30-45 градусів.' },
            { id: 'ex_alt_3', category: 'Плечі та Груди', name: 'Махи гантелями в нахилі (задня дельта)', desc: 'Нахил тулуба 60°, розведення рук у сторони для опрацювання задньої частини плечей.' },

            // --- РУКИ (БІЦЕПС / ТРИЦЕПС) ---
            { id: 'ex_t1_7', category: 'Руки (Біцепс / Трицепс)', name: 'Віджимання від лави на трицепс', desc: 'План: 4 х 30-25-25-20.\nТехніка: Руки спираються на лаву ззаду. Опускай таз вертикально до кута 90° у ліктях.' },
            { id: 'ex_t1_9', category: 'Руки (Біцепс / Трицепс)', name: 'Підйом штанги на біцепс (повний)', desc: 'План: 4 х 10.\nТехніка: Лікті притиснуті до тулуба. Піднімай гриф від стегон до верхньої точки грудей без розгойдування.' },
            { id: 'ex_t1_10', category: 'Руки (Біцепс / Трицепс)', name: 'Підйом штанги на біцепс (наполовину)', desc: 'План: 4 х 10.\nТехніка: Робота у частковій амплітуді (від стегон до паралелі з підлогою або від паралелі до грудей).' },
            { id: 'ex_t1_11', category: 'Руки (Біцепс / Трицепс)', name: 'Підйом гантелей на біцепс (наполовину)', desc: 'План: 4 х 10.\nТехніка: Акцентоване опрацювання біцепса у частковій амплітуді без розслаблення у крайніх точках.' },
            { id: 'ex_t1_12', category: 'Руки (Біцепс / Трицепс)', name: 'Згинання на біцепс з упором у коліно', desc: 'План: 4 х 10-12.\nТехніка: Сидячи, лікоть спирається у внутрішню частину стегна. Піднімай гантель чітко зусиллям біцепса.' },
            { id: 'ex_t2_8', category: 'Руки (Біцепс / Трицепс)', name: 'Підйом гантелей "Молоток"', desc: 'План: 4 х 10-12.\nТехніка: Хват нейтральний (долоні дивляться одна на одну). Згинання рук без розвертання кистей.' },
            { id: 'ex_t2_9', category: 'Руки (Біцепс / Трицепс)', name: 'Розгинання руки з гантеллю на трицепс (із-за голови)', desc: 'План: 4 х 10-12.\nТехніка: Лікоть дивиться вгору і зафіксований. Розгинай руку з гантеллю вгору над головою.' },
            { id: 'ex_alt_2', category: 'Руки (Біцепс / Трицепс)', name: 'Французький жим з гантелями', desc: 'Ізольована вправа на трицепс лежачи. Згинання ліктів до скронь.' },

            // --- КОР ТА ПРЕС ---
            { id: 'ex_t1_13', category: 'Кор та Прес', name: 'Скручування на прес', desc: 'План: 4 х макс.\nТехніка: Лежачи на спині, відривай лише лопатки від підлоги, максимально скорочуючи м\'язи преса.' },
            { id: 'ex_alt_4', category: 'Кор та Прес', name: 'Підйом ніг у висі', desc: 'Ефективна вправа на нижню частину преса. Підйом колін або прямих ніг до паралелі.' },
            { id: 'ex_alt_5', category: 'Кор та Прес', name: 'Планка', desc: 'Статична вправа на корі. Тримай тіло ідеально рівним від голови до п\'ят.' }
        ];

        let appState = JSON.parse(localStorage.getItem('powerlog_state')) || {
            activeDayId: 'day_1',
            exerciseBase: initialExerciseBase,
            days: [
                { id: 'day_1', label: 'День 1', exercises: [] },
                { id: 'day_2', label: 'День 2', exercises: [] }
            ]
        };

        let timerInterval = null;

        window.onload = function() {
            if (!appState.exerciseBase || appState.exerciseBase.length === 0) {
                appState.exerciseBase = initialExerciseBase;
            }
            renderDaysTabs();
            renderExerciseSelect();
            renderWorkoutList();
        };

        function saveState() {
            localStorage.setItem('powerlog_state', JSON.stringify(appState));
            renderWorkoutList();
        }

        // --- ДНІ ТРЕНУВАННЯ ---
        function renderDaysTabs() {
            const container = document.getElementById('days-tabs');
            container.innerHTML = '';

            appState.days.forEach(day => {
                const isActive = day.id === appState.activeDayId;
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${
                    isActive ? 'bg-cyan-400 text-black shadow-lg shadow-cyan-400/20' : 'bg-gray-900 border border-gray-800 text-gray-400 hover:text-white'
                }`;
                btn.innerText = day.label;
                btn.onclick = () => {
                    appState.activeDayId = day.id;
                    renderDaysTabs();
                    renderWorkoutList();
                };
                container.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "px-3 py-1.5 rounded-full text-xs font-bold bg-gray-900 border border-dashed border-gray-700 text-gray-400 hover:text-white transition whitespace-nowrap";
            addBtn.innerText = "+ Новий день";
            addBtn.onclick = addNewDay;
            container.appendChild(addBtn);

            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            document.getElementById('active-day-title').innerText = activeDay ? activeDay.label : '';
        }

        function addNewDay() {
            const newId = 'day_' + Date.now();
            const newNum = appState.days.length + 1;
            appState.days.push({
                id: newId,
                label: `День ${newNum}`,
                exercises: []
            });
            appState.activeDayId = newId;
            saveState();
            renderDaysTabs();
        }

        // --- БАЗА ВПРАВ З КАТЕГОРІЯМИ ---
        function renderExerciseSelect() {
            const select = document.getElementById('exercise-select');
            select.innerHTML = '';

            const categories = {};
            appState.exerciseBase.forEach(ex => {
                const cat = ex.category || 'Власні вправи';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(ex);
            });

            for (const catName in categories) {
                const group = document.createElement('optgroup');
                group.label = catName;

                categories[catName].forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.innerText = ex.name;
                    group.appendChild(opt);
                });

                select.appendChild(group);
            }
        }

        function addExerciseToDay() {
            const select = document.getElementById('exercise-select');
            const exId = select.value;
            if (!exId) return;

            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            if (!activeDay) return;

            activeDay.exercises.push({
                instanceId: 'inst_' + Date.now(),
                exId: exId,
                sets: [
                    { weight: '', reps: 10, done: false },
                    { weight: '', reps: 10, done: false },
                    { weight: '', reps: 10, done: false },
                    { weight: '', reps: 10, done: false }
                ]
            });

            saveState();
        }

        function moveExercise(instanceId, direction) {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            if (!activeDay) return;

            const idx = activeDay.exercises.findIndex(e => e.instanceId === instanceId);
            if (idx === -1) return;

            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= activeDay.exercises.length) return;

            const temp = activeDay.exercises[idx];
            activeDay.exercises[idx] = activeDay.exercises[newIdx];
            activeDay.exercises[newIdx] = temp;

            saveState();
        }

        function removeExerciseFromDay(instanceId) {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            if (!activeDay) return;

            activeDay.exercises = activeDay.exercises.filter(e => e.instanceId !== instanceId);
            saveState();
        }

        function addSetToExercise(instanceId) {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            const item = activeDay?.exercises.find(e => e.instanceId === instanceId);
            if (!item) return;

            const lastSet = item.sets[item.sets.length - 1] || { weight: '', reps: 10, done: false };
            item.sets.push({ weight: lastSet.weight, reps: lastSet.reps, done: false });
            saveState();
        }

        function removeSetFromExercise(instanceId) {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            const item = activeDay?.exercises.find(e => e.instanceId === instanceId);
            if (!item || item.sets.length <= 1) return;

            item.sets.pop();
            saveState();
        }

        // --- СПИСОК ВПРАВ ТРЕНУВАННЯ ---
        function renderWorkoutList() {
            const container = document.getElementById('workout-exercises-list');
            container.innerHTML = '';

            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            if (!activeDay || activeDay.exercises.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 border border-dashed border-gray-800 rounded-2xl">
                        <p class="text-xs text-gray-500">У цьому дні ще немає доданих вправ</p>
                    </div>
                `;
                calculateProgress();
                return;
            }

            activeDay.exercises.forEach((item, index) => {
                const baseEx = appState.exerciseBase.find(b => b.id === item.exId) || { name: 'Вправа', desc: '' };
                const card = document.createElement('div');
                card.className = "bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-sm";

                let setsHTML = '';
                item.sets.forEach((set, sIdx) => {
                    setsHTML += `
                        <div class="grid grid-cols-12 gap-2 items-center mb-2">
                            <span class="col-span-1 text-xs text-gray-500 font-mono font-bold">${sIdx + 1}</span>
                            <div class="col-span-5">
                                <input type="number" value="${set.weight}" placeholder="0" onchange="updateSetData('${item.instanceId}', ${sIdx}, 'weight', this.value)" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-1.5 px-2 text-center text-xs font-bold text-white font-mono focus:outline-none focus:border-cyan-400">
                            </div>
                            <div class="col-span-4">
                                <input type="number" value="${set.reps}" placeholder="10" onchange="updateSetData('${item.instanceId}', ${sIdx}, 'reps', this.value)" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-1.5 px-2 text-center text-xs font-bold text-white font-mono focus:outline-none focus:border-cyan-400">
                            </div>
                            <div class="col-span-2 flex justify-center">
                                <button onclick="toggleSetDone('${item.instanceId}', ${sIdx})" class="w-8 h-8 rounded-xl font-bold text-xs flex items-center justify-center transition ${
                                    set.done ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'bg-gray-950 text-gray-600 border border-gray-800'
                                }">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-3">
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-black text-white leading-snug break-words">${baseEx.name}</h3>
                            <span class="text-[10px] text-gray-500 font-medium">План: ${item.sets.length} підходів</span>
                        </div>
                        
                        <div class="flex items-center space-x-1 flex-shrink-0 bg-gray-950 border border-gray-800/80 rounded-xl p-1">
                            ${baseEx.desc ? `<button onclick="openInfoModal('${baseEx.name}', \`${baseEx.desc}\`)" class="w-7 h-7 text-cyan-400 hover:bg-gray-800 rounded-lg text-xs font-bold flex items-center justify-center" title="Підказка"><i class="fa-solid fa-circle-question"></i></button>` : ''}
                            <button onclick="moveExercise('${item.instanceId}', -1)" ${index === 0 ? 'disabled class="opacity-20"' : ''} class="w-7 h-7 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg text-xs flex items-center justify-center"><i class="fa-solid fa-arrow-up"></i></button>
                            <button onclick="moveExercise('${item.instanceId}', 1)" ${index === activeDay.exercises.length - 1 ? 'disabled class="opacity-20"' : ''} class="w-7 h-7 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg text-xs flex items-center justify-center"><i class="fa-solid fa-arrow-down"></i></button>
                            <button onclick="removeExerciseFromDay('${item.instanceId}')" class="w-7 h-7 text-red-400 hover:bg-red-500/10 rounded-lg text-xs flex items-center justify-center" title="Видалити"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-12 gap-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2 px-1">
                        <span class="col-span-1">Сет</span>
                        <span class="col-span-5 text-center">Вага (кг)</span>
                        <span class="col-span-4 text-center">Повтори</span>
                        <span class="col-span-2 text-center">Статус</span>
                    </div>

                    ${setsHTML}

                    <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-gray-800/60">
                        <button onclick="addSetToExercise('${item.instanceId}')" class="py-1.5 bg-gray-950 hover:bg-gray-800 border border-gray-800 text-cyan-400 rounded-xl text-[11px] font-semibold transition">
                            + Підхід
                        </button>
                        <button onclick="removeSetFromExercise('${item.instanceId}')" ${item.sets.length <= 1 ? 'disabled class="opacity-30 py-1.5 bg-gray-950 border border-gray-800 text-gray-500 rounded-xl text-[11px]"' : 'class="py-1.5 bg-gray-950 hover:bg-gray-800 border border-gray-800 text-red-400 rounded-xl text-[11px] font-semibold transition"'}>
                            - Підхід
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            calculateProgress();
        }

        function updateSetData(instanceId, setIdx, field, val) {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            const item = activeDay?.exercises.find(e => e.instanceId === instanceId);
            if (!item || !item.sets[setIdx]) return;

            item.sets[setIdx][field] = parseFloat(val) || 0;
            saveState();
        }

        function toggleSetDone(instanceId, setIdx) {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            const item = activeDay?.exercises.find(e => e.instanceId === instanceId);
            if (!item || !item.sets[setIdx]) return;

            item.sets[setIdx].done = !item.sets[setIdx].done;

            if (item.sets[setIdx].done) {
                startTimer(60);
            }

            saveState();
        }

        function calculateProgress() {
            const activeDay = appState.days.find(d => d.id === appState.activeDayId);
            if (!activeDay || activeDay.exercises.length === 0) {
                document.getElementById('workout-progress-text').innerText = '0% (0/0)';
                document.getElementById('workout-progress-bar').style.width = '0%';
                document.getElementById('total-volume').innerText = '0 кг';
                return;
            }

            let totalSets = 0;
            let doneSets = 0;
            let totalVolume = 0;

            activeDay.exercises.forEach(ex => {
                ex.sets.forEach(s => {
                    totalSets++;
                    if (s.done) {
                        doneSets++;
                        const w = parseFloat(s.weight) || 0;
                        const r = parseFloat(s.reps) || 0;
                        totalVolume += (w * r);
                    }
                });
            });

            const percent = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
            document.getElementById('workout-progress-text').innerText = `${percent}% (${doneSets}/${totalSets})`;
            document.getElementById('workout-progress-bar').style.width = `${percent}%`;
            document.getElementById('total-volume').innerText = `${totalVolume.toLocaleString('uk-UA')} кг`;
        }

        // --- МОДАЛКИ ВПРАВ ТА ПІДКАЗОК ---
        function openNewExerciseModal() {
            document.getElementById('exercise-modal').classList.remove('hidden');
        }

        function closeNewExerciseModal() {
            document.getElementById('exercise-modal').classList.add('hidden');
            document.getElementById('new-ex-name').value = '';
            document.getElementById('new-ex-desc').value = '';
        }

        function createNewExercise() {
            const name = document.getElementById('new-ex-name').value.trim();
            const desc = document.getElementById('new-ex-desc').value.trim();

            if (!name) {
                alert('Введіть назву вправи!');
                return;
            }

            const newId = 'ex_custom_' + Date.now();
            appState.exerciseBase.unshift({ 
                id: newId, 
                category: '✨ Власні вправи', 
                name: name, 
                desc: desc || 'Власна вправа' 
            });
            
            closeNewExerciseModal();
            renderExerciseSelect();
            saveState();
        }

        function openInfoModal(title, text) {
            document.getElementById('info-modal-title').innerText = title;
            document.getElementById('info-modal-body').innerText = text;
            document.getElementById('info-modal').classList.remove('hidden');
        }

        function closeInfoModal() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        // --- ТАЙМЕР ВІДПОЧИНКУ ---
        function startTimer(seconds) {
            stopTimer();
            let left = seconds;
            updateTimerDisplay(left);

            timerInterval = setInterval(() => {
                left--;
                if (left <= 0) {
                    stopTimer();
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                } else {
                    updateTimerDisplay(left);
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimerDisplay(0);
        }

        function updateTimerDisplay(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        // --- ЕКСПОРТ / ІМПОРТ / СКИДАННЯ ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `powerlog_backup_${new Date().toISOString().slice(0,10)}.json`);
            dl.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = re => {
                    try {
                        const parsed = JSON.parse(re.target.result);
                        if (parsed.days && parsed.exerciseBase) {
                            appState = parsed;
                            saveState();
                            renderDaysTabs();
                            renderExerciseSelect();
                            alert('Дані імпортовано успішно!');
                        }
                    } catch (err) {
                        alert('Помилка імпорту.');
                    }
                }
            }
            input.click();
        }

        function resetData() {
            if (confirm('Ви впевнені, що хочете скинути дані та відновити оновлену базу вправ?')) {
                localStorage.removeItem('powerlog_state');
                location.reload();
            }
        }
    </script>
</body>
</html>
