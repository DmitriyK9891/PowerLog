<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLog — Тренувальний Щоденник</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #95a5a6;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .day-switcher {
            display: flex;
            background-color: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .add-exercise-panel {
            background-color: var(--card-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        select, .btn-main {
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        select {
            flex-grow: 1;
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #444;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .exercise-title {
            font-size: 17px;
            font-weight: bold;
            line-height: 1.3;
        }

        .exercise-tip {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        .btn-info {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .exercise-visual {
            display: none;
            text-align: center;
            margin: 12px 0;
            border-radius: 8px;
            background-color: #151515;
            padding: 20px 0;
            border: 1px solid #2d2d2d;
        }

        .exercise-visual svg {
            width: 80px;
            height: 80px;
            fill: var(--accent-color);
            margin: 0 auto;
            display: block;
        }

        .visual-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .sets-table th {
            color: var(--text-muted);
            font-size: 12px;
            text-align: left;
            padding-bottom: 8px;
        }

        .set-row {
            border-top: 1px solid #2d2d2d;
        }

        .set-row td {
            padding: 8px 0;
        }

        .input-field {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            width: 55px;
            text-align: center;
            font-size: 14px;
        }

        .btn-check {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            min-width: 65px;
        }

        .btn-check.done {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .btn-add-set {
            background: none;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            width: 100%;
            padding: 6px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 2px solid var(--accent-color);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .timer-display {
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
        }
        
        .timer-display.alarm {
            color: var(--danger-color);
            animation: blink 1s infinite;
        }

        .timer-btn {
            background-color: var(--accent-color);
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear-all {
            background-color: #333;
            color: var(--text-muted);
            border: 1px solid #444;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PowerLog</h1>
            <p>Твій тренувальний щоденник</p>
        </header>

        <div class="day-switcher">
            <button id="btnDayA" class="tab-btn active" onclick="switchDay('dayA')">Тренування 1</button>
            <button id="btnDayB" class="tab-btn" onclick="switchDay('dayB')">Тренування 2</button>
        </div>

        <div class="add-exercise-panel">
            <select id="exerciseSelect">
                <optgroup label="Ноги та Сідниці">
                    <option value="single_leg_lunges">Випади на одній нозі</option>
                    <option value="db_squats">Присідання з гантелями</option>
                    <option value="sumo_squat">Присідання сумо з однією гантеллю</option>
                    <option value="romanian_deadlift">Станова тяга на прямих ногах</option>
                </optgroup>
                <optgroup label="Груди та Спина">
                    <option value="db_bench_press">Жим гантелей лежачи</option>
                    <option value="pushups">Віджимання від підлоги</option>
                    <option value="db_flyes">Розведення гантелей лежачи</option>
                    <option value="bb_row">Тяга штанги до пояса</option>
                    <option value="one_arm_db_row">Тяга гантелі однією рукою в нахилі</option>
                </optgroup>
                <optgroup label="Плечі та Трапеції">
                    <option value="db_shrugs">Шраги з гантелями</option>
                    <option value="db_seated_press">Жим гантелей сидячи</option>
                    <option value="db_front_raise">Підйом гантелей перед собою</option>
                    <option value="db_lateral_raise">Підйом гантелей в сторони</option>
                    <option value="bb_upright_row">Підйом штанги до грудей (Вертоліт)</option>
                </optgroup>
                <optgroup label="Руки (Біцепс/Трицепс)">
                    <option value="bb_biceps_full">Підйом штанги на біцепс (повний)</option>
                    <option value="bb_biceps_half">Підйом штанги на біцепс (наполовину)</option>
                    <option value="db_biceps_half">Підйом гантелей на біцепс (наполовину)</option>
                    <option value="db_concentration_curl">Жим гантелі на біцепс з упором в коліно</option>
                    <option value="db_hammer_curl">"Молоток": підйом гантелей на біцепс</option>
                    <option value="bench_dips">Віджимання від лави (табурета) на трицепс</option>
                    <option value="db_triceps_extension">Підйом гантелі на трицепс</option>
                </optgroup>
                <optgroup label="Коре">
                    <option value="abs">Прес</option>
                </optgroup>
            </select>
            <button class="btn-main" onclick="addExercise()">+ Додати</button>
        </div>

        <div id="workoutContainer"></div>
        
        <button class="btn-clear-all" onclick="clearCurrentDay()">Очистити цей день</button>
    </div>

    <div class="timer-panel">
        <div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Відпочинок</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>
        <button class="timer-btn" onclick="startTimer(60)">60 с</button>
        <button class="timer-btn" onclick="startTimer(90)">90 с</button>
        <button class="timer-btn" style="background-color: #333;" onclick="stopTimer()">Стоп</button>
    </div>

    <script>
        // Вбудовані векторні SVG-іконки. Вони є частиною коду і завантажуються ГАРАНТОВАНО без інтернету.
        const svgIcons = {
            dumbbell: `<svg viewBox="0 0 24 24"><path d="M5 9h1a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1zm14 0h1a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zM7 11h10v-2H7v2zm-2 4h14v-2H5v2z"/></svg>`,
            barbell: `<svg viewBox="0 0 24 24"><path d="M3 11H1v2h2v-2zm18 0h2v2h-2v-2zM6 9h1a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1zm11 0h1a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1zM4 13h16v-2H4v2z"/></svg>`,
            bodyweight: `<svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm1 7h-2c-1.1 0-2 .9-2 2v5h2v6h2v-6h2v-5c0-1.1-.9-2-2-2z"/></svg>`,
            bench: `<svg viewBox="0 0 24 24"><path d="M21 10H3c-1.1 0-2 .9-2 2v3h2v4h2v-4h14v4h2v-4h2v-3c0-1.1-.9-2-2-2zM5 12h14v1H5v-1z"/></svg>`
        };

        const exerciseDB = {
            single_leg_lunges: { title: "Випади на одній нозі", tip: "План: 3 підходи по 10-12 повторень", type: "dumbbell", label: "Інвентар: Гантелі (Асиметрія)" },
            db_squats: { title: "Присідання з гантелями", tip: "План: 3 підходи по 8-10 повторень", type: "dumbbell", label: "Інвентар: Гантелі з обох боків" },
            db_shrugs: { title: "Шраги з гантелями", tip: "План: 3 підходи по 8-10 повторень", type: "dumbbell", label: "Інвентар: Гантелі в опущених руках" },
            db_seated_press: { title: "Жим гантелей сидячи (вгору)", tip: "План: 3 підходи по 10-12 повторень", type: "dumbbell", label: "Інвентар: Гантелі (Вгору від плечей)" },
            db_bench_press: { title: "Жим гантелей лежачи", tip: "План: 4 підходи по 10-12 повторень", type: "bench", label: "Інвентар: Гантелі + Горизонтальна лава" },
            pushups: { title: "Віджимання від підлоги", tip: "План: 4 підходи (30-25-25-20 повторів)", type: "bodyweight", label: "Інвентар: Власна вага (Упор лежачи)" },
            bench_dips: { title: "Віджимання від лави (табурета) на трицепс", tip: "План: 4 підходи (30-25-25-20 повторів)", type: "bench", label: "Інвентар: Опора ззаду (Лава/Стілець)" },
            bb_row: { title: "Тяга штанги до пояса в нахилі", tip: "План: 4 підходи по 12-15 повторень", type: "barbell", label: "Інвентар: Штанга (Хват до себе/від себе)" },
            bb_biceps_full: { title: "Підйом штанги на біцепс (повна амплітуда)", tip: "План: 4 підходи по 10 повторень", type: "barbell", label: "Інвентар: Штанга стоячи" },
            bb_biceps_half: { title: "Підйом штанги на біцепс (наполовину)", tip: "План: 4 підходи по 10 повторень", type: "barbell", label: "Інвентар: Штанга (Часткова амплітуда)" },
            db_biceps_half: { title: "Підйом гантелей на біцепс (наполовину)", type: "dumbbell", tip: "План: 4 підходи по 10 повторень", label: "Інвентар: Гантелі (Супінація наполовину)" },
            db_concentration_curl: { title: "Жим гантелі на біцепс з упором в коліно", tip: "План: 4 підходи по 10-12 повторень", type: "dumbbell", label: "Інвентар: Одна гантель + упор ліктем" },
            abs: { title: "Прес (скручування)", tip: "Опрацювання м'язів живота до відмови", type: "bodyweight", label: "Інвентар: Килимок (Власна вага)" },
            
            sumo_squat: { title: "Присідання сумо з однією гантеллю", tip: "План: 4 підходи по 10 повторень", type: "dumbbell", label: "Інвентар: Одна важка гантель по центру" },
            db_front_raise: { title: "Підйом гантелей перед собою", tip: "План: 4 підходи по 12-15 повторень", type: "dumbbell", label: "Інвентар: Гантелі (Фронтальна дельта)" },
            db_lateral_raise: { title: "Підйом гантелей в сторони", tip: "План: 4 підходи по 12-15 повторень", type: "dumbbell", label: "Інвентар: Гантелі (Середня дельта)" },
            bb_upright_row: { title: "Підйом штанги до грудей 'Вертоліт'", tip: "План: 4 підходи по 10 повторень", type: "barbell", label: "Інвентар: Штанга (Вузький хват до підборіддя)" },
            romanian_deadlift: { title: "Станова тяга на прямих ногах", tip: "План: 4 підходи по 10-12 повторень", type: "barbell", label: "Інвентар: Штанга / Важкі гантелі" },
            db_flyes: { title: "Розведення гантелей лежачи", tip: "План: 4 підходи по 10-12 повторень", type: "bench", label: "Інвентар: Гантелі (Розведення на лаві)" },
            one_arm_db_row: { title: "Тяга гантелі однією рукою в нахилі", tip: "План: 4 підходи по 12-15 повторень", type: "dumbbell", label: "Інвентар: Одна гантель + опора на коліно" },
            db_hammer_curl: { title: '«Молоток»: підйом гантелей на біцепс', tip: "План: 4 підходи по 10-12 повторень", type: "dumbbell", label: "Інвентар: Гантелі хватом 'Нейтральний'" },
            db_triceps_extension: { title: "Підйом гантелі на трицепс через голову", tip: "План: 4 підходи по 10-12 повторень", type: "dumbbell", label: "Інвентар: Одна гантель (З-за голови двома руками)" }
        };

        let timerInterval = null;
        let currentDay = 'dayA'; 
        
        let globalState = {
            dayA: [],
            dayB: []
        };

        window.onload = function() {
            const savedData = localStorage.getItem('powerLogWorkoutData_v4');
            if (savedData) {
                globalState = JSON.parse(savedData);
            }
            renderState();
        };

        function saveToLocalStorage() {
            localStorage.setItem('powerLogWorkoutData_v4', JSON.stringify(globalState));
        }

        function switchDay(dayKey) {
            currentDay = dayKey;
            document.getElementById('btnDayA').classList.toggle('active', dayKey === 'dayA');
            document.getElementById('btnDayB').classList.toggle('active', dayKey === 'dayB');
            renderState();
        }

        function addExercise() {
            const select = document.getElementById('exerciseSelect');
            const exerciseKey = select.value;
            
            const newExercise = {
                id: 'ex_' + Date.now(),
                key: exerciseKey,
                showVisual: false,
                sets: [{ weight: 16, reps: 10, done: false }]
            };

            globalState[currentDay].push(newExercise);
            saveToLocalStorage();
            renderState();
        }

        function removeExercise(id) {
            globalState[currentDay] = globalState[currentDay].filter(ex => ex.id !== id);
            saveToLocalStorage();
            renderState();
        }

        function addSet(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                const lastSet = exercise.sets[exercise.sets.length - 1];
                exercise.sets.push({
                    weight: lastSet ? lastSet.weight : 16,
                    reps: lastSet ? lastSet.reps : 10,
                    done: false
                });
                saveToLocalStorage();
                renderState();
            }
        }

        function updateSetData(exerciseId, setIndex, field, value) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex][field] = parseFloat(value) || value;
                saveToLocalStorage();
            }
        }

        function toggleVisual(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                exercise.showVisual = !exercise.showVisual;
                saveToLocalStorage();
                renderState();
            }
        }

        function toggleSetDone(exerciseId, setIndex) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex].done = !exercise.sets[setIndex].done;
                saveToLocalStorage();
                renderState();

                if (exercise.sets[setIndex].done) {
                    startTimer(90); 
                }
            }
        }

        function clearCurrentDay() {
            if (confirm(`Очистити поточні записи для цього тренування?`)) {
                globalState[currentDay] = [];
                saveToLocalStorage();
                renderState();
                stopTimer();
            }
        }

        function renderState() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            const currentExercises = globalState[currentDay] || [];

            if (currentExercises.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:30px; font-size:14px; border: 1px dashed #333; padding: 20px; border-radius: 8px;">Список порожній.<br>Обери вправу зі свого плану вгорі та натисни "+ Додати".</div>`;
                return;
            }

            currentExercises.forEach(ex => {
                const dbData = exerciseDB[ex.key];
                if (!dbData) return;
                
                let setsHTML = '';
                ex.sets.forEach((set, index) => {
                    setsHTML += `
                        <tr class="set-row">
                            <td>${index + 1}</td>
                            <td><input type="number" class="input-field" value="${set.weight}" onchange="updateSetData('${ex.id}', ${index}, 'weight', this.value)"></td>
                            <td><input type="number" class="input-field" value="${set.reps}" onchange="updateSetData('${ex.id}', ${index}, 'reps', this.value)"></td>
                            <td style="text-align: right;">
                                <button class="btn-check ${set.done ? 'done' : ''}" onclick="toggleSetDone('${ex.id}', ${index})">
                                    ${set.done ? '✓' : 'Done'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                // Витягуємо відповідний код SVG-іконки з нашого внутрішнього сховища
                const activeSvg = svgIcons[dbData.type] || svgIcons.dumbbell;

                const cardHTML = `
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <span class="exercise-title">${dbData.title}</span>
                            <div>
                                <button class="btn-delete" onclick="removeExercise('${ex.id}')">🗑️</button>
                                <button class="btn-info" onclick="toggleVisual('${ex.id}')">?</button>
                            </div>
                        </div>
                        <div class="exercise-tip">${dbData.tip}</div>

                        <div class="exercise-visual" style="display: ${ex.showVisual ? 'block' : 'none'}">
                            ${activeSvg}
                            <div class="visual-label">${dbData.label}</div>
                        </div>

                        <table class="sets-table">
                            <thead>
                                <tr>
                                    <th>Сет</th>
                                    <th>Вага (кг)</th>
                                    <th>Повтори</th>
                                    <th style="text-align: right;">Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${setsHTML}
                            </tbody>
                        </table>
                        <button class="btn-add-set" onclick="addSet('${ex.id}')">+ Додати підхід</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            
            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    display.classList.add('alarm');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            display.innerText = "00:00";
        }

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
