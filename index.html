<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLog Pro — Твій Щоденник Тренувань</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-color: #45f3ff;
            --accent-muted: #1f6e75;
            --text-color: #c5c6c7;
            --text-light: #ffffff;
            --text-muted: #66fcf1;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: left;
            margin-top: 10px;
        }

        header h1 {
            margin: 0;
            color: var(--text-light);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            color: #8d99ae;
            margin: 3px 0 0 0;
            font-size: 13px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8d99ae;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Горизонтальний список програм з AppStore */
        .programs-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .programs-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .programs-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .program-card {
            flex: 0 0 200px;
            background: linear-gradient(135deg, #1f2833 0%, #151a21 100%);
            border: 1px solid #2d3748;
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            scroll-snap-align: start;
        }

        .program-card.active {
            border-color: var(--accent-color);
            box-shadow: 0 4px 20px rgba(69, 243, 255, 0.15);
        }

        .program-card h3 {
            margin: 0 0 6px 0;
            color: var(--text-light);
            font-size: 16px;
            font-weight: 700;
            padding-right: 20px;
        }

        .program-card p {
            margin: 0;
            font-size: 12px;
            color: #8d99ae;
        }

        .btn-delete-program {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            opacity: 0.6;
        }
        .btn-delete-program:hover { opacity: 1; }

        .btn-create-program {
            background-color: #151a21;
            border: 1px dashed var(--accent-color);
            color: var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        /* Дні тренувань */
        .days-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .day-tab {
            background-color: #151a21;
            border: 1px solid #2d3748;
            color: #8d99ae;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-tab.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: 700;
        }

        .btn-add-day {
            background: none;
            border: 1px dashed #444;
            color: #8d99ae;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* Панель додавання вправ */
        .add-exercise-panel {
            background-color: #151a21;
            border: 1px solid #2d3748;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        select, .btn-main {
            font-size: 14px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            height: 48px;
            box-sizing: border-box;
        }

        select {
            flex-grow: 1;
            background-color: #1f2833;
            color: var(--text-light);
            border: 1px solid #2d3748;
            width: 100%;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            min-width: 110px;
        }

        #workoutContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .exercise-card {
            background-color: #151a21;
            border: 1px solid #2d3748;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .exercise-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-light);
        }

        .exercise-tip {
            font-size: 12px;
            color: #8d99ae;
            margin-bottom: 12px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            margin-right: 12px;
        }

        .btn-info {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }

        .exercise-guide {
            display: none;
            background-color: #0b0c10;
            border-left: 3px solid var(--accent-color);
            padding: 12px;
            margin: 14px 0;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
        }

        .guide-item { margin-bottom: 8px; }
        .guide-item:last-child { margin-bottom: 0; }
        .guide-title {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .sets-table th {
            color: #8d99ae;
            font-size: 12px;
            text-align: left;
            padding-bottom: 8px;
            font-weight: 600;
        }

        .set-row { border-top: 1px solid #2d3748; }
        .set-row td { padding: 10px 0; }

        .input-field {
            background-color: #1f2833;
            border: 1px solid #2d3748;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            width: 55px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-check {
            background-color: #1f2833;
            border: 1px solid #2d3748;
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            min-width: 65px;
            transition: all 0.1s;
        }

        .btn-check.done {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: #000;
        }

        .btn-add-set {
            background: none;
            border: 1px dashed #444;
            color: #8d99ae;
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #151a21;
            border-top: 1px solid #2d3748;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
            z-index: 100;
        }

        .timer-display {
            font-size: 28px;
            font-weight: 700;
            font-family: monospace;
            color: var(--accent-color);
        }
        
        .timer-display.alarm {
            color: var(--danger-color);
            animation: blink 1s infinite;
        }

        .timer-btn {
            background-color: #1f2833;
            border: 1px solid #2d3748;
            color: var(--text-light);
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .sync-panel {
            background-color: #151a21;
            border: 1px solid #2d3748;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-sync {
            flex: 1;
            background-color: #1f2833;
            border: 1px solid #444;
            color: var(--text-light);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-clear-all {
            background: none;
            color: var(--danger-color);
            border: 1px solid rgba(231, 76, 61, 0.3);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-top: 5px;
        }

        @keyframes blink { 50% { opacity: 0.3; } }

        @media (max-width: 420px) {
            .add-exercise-panel { flex-direction: column; }
            .btn-main { width: 100%; }
            .sync-panel { flex-direction: column; }
            body { padding: 10px; padding-bottom: 150px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PowerLog Pro</h1>
            <p>Твої кастомні програми тренувань</p>
        </header>

        <div>
            <div class="section-title">Мої Програми</div>
            <div class="programs-scroll" id="programsContainer"></div>
        </div>

        <button class="btn-create-program" onclick="createNewProgram()">+ Створити власну програму</button>

        <div>
            <div class="section-title" id="daysTitle">Дні Тренування</div>
            <div class="days-container" id="daysTabsContainer"></div>
        </div>

        <div class="add-exercise-panel">
            <select id="exerciseSelect">
                <optgroup label="Ноги та Сідниці">
                    <option value="single_leg_lunges">Випади на одній нозі</option>
                    <option value="db_squats">Присідання з гантелями</option>
                    <option value="sumo_squat">Присідання сумо з однією гантеллю</option>
                    <option value="romanian_deadlift">Станова тяга на прямих ногах</option>
                </optgroup>
                <optgroup label="Груди та Спина">
                    <option value="db_bench_press">Жим гантелей лежачи</option>
                    <option value="pushups">Віджимання від підлоги</option>
                    <option value="db_flyes">Розведення гантелей лежачи</option>
                    <option value="bb_row">Тяга штанги до пояса</option>
                    <option value="one_arm_db_row">Тяга гантелі однією рукою в нахилі</option>
                </optgroup>
                <optgroup label="Плечі та Трапеції">
                    <option value="db_shrugs">Шраги з гантелями</option>
                    <option value="db_seated_press">Жим гантелей сидячи</option>
                    <option value="db_front_raise">Підйом гантелей перед собою</option>
                    <option value="db_lateral_raise">Підйом гантелей в сторони</option>
                    <option value="bb_upright_row">Підйом штанги до грудей (Вертоліт)</option>
                </optgroup>
                <optgroup label="Руки (Біцепс/Трицепс)">
                    <option value="bb_biceps_full">Підйом штанги на біцепс (повний)</option>
                    <option value="bb_biceps_half">Підйом штанги на біцепс (наполовину)</option>
                    <option value="db_biceps_half">Підйом гантелей на біцепс (наполовину)</option>
                    <option value="db_concentration_curl">Підйом гантелі на біцепс з упором в коліно</option>
                    <option value="db_hammer_curl">"Молоток": підйом гантелей на біцепс</option>
                    <option value="bench_dips">Віджимання від лави (табурета) на трицепс</option>
                    <option value="db_triceps_extension">Підйом гантелі на трицепс з-за голови</option>
                </optgroup>
                <optgroup label="Коре">
                    <option value="abs">Прес</option>
                </optgroup>
            </select>
            <button class="btn-main" onclick="addExercise()">+ Вправу</button>
        </div>

        <div id="workoutContainer"></div>
        
        <button class="btn-clear-all" onclick="clearCurrentDay()">Видалити всі вправи з цього дня</button>

        <div>
            <div class="section-title">Синхронізація (ПК ⇄ Смартфон)</div>
            <div class="sync-panel">
                <button class="btn-sync" onclick="exportData()">📤 Скопіювати код даних</button>
                <button class="btn-sync" onclick="importData()">📥 Вставити код даних</button>
            </div>
        </div>
    </div>

    <div class="timer-panel">
        <div>
            <div style="font-size: 10px; color: #8d99ae; text-transform: uppercase; font-weight: 700;">Відпочинок</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>
        <button class="timer-btn" onclick="startTimer(60)">60 с</button>
        <button class="timer-btn" onclick="startTimer(90)">90 с</button>
        <button class="timer-btn" style="background-color: #1a1a1a;" onclick="stopTimer()">Стоп</button>
    </div>

    <script>
        const exerciseDB = {
            single_leg_lunges: { title: "Випади на одній нозі", tip: "План: 3 підходи по 10-12 повторень", eq: "Дві гантелі в руках.", pos: "Одна нога попереду, інша ззаду на носку. Спина рівна, погляд спрямований вперед.", tech: "Опускайся вертикально вниз, щоб коліно передньої ноги не виходило за лінію носка. Основна вага тіла тисне на п'яту передньої ноги. Опускайся до паралелі стегна з підлогою, після чого піднімайся потужним рухом вгору." },
            db_squats: { title: "Присідання з гантелями", tip: "План: 3 підходи по 8-10 повторень", eq: "Дві гантелі в опущених руках або утримуються на плечах.", pos: "Ноги на ширині плечей, носки розгорнуті в сторони на 15-30 градусів.", tech: "Починай рух з відведення тазу назад, ніби сідаєш на стілець. Тримай коліна в напрямку носків. Спина пряма. Присідай до паралелі та вставай, штовхаючись п'ятами." },
            db_shrugs: { title: "Шраги з гантелями", tip: "План: 3 підходи по 8-10 повторень", eq: "Важкі гантелі з боків корпусу.", pos: "Стоячи, ноги на ширині стегон, руки повністю випрямлені в ліктях.", tech: "Ізольованим рухом піднімай плечі вгору в напрямку вух. Не згинай лікті і не обертай плечима по колу. Роби коротку паузу в верхній точці, після чого плавно опускай вагу." },
            db_seated_press: { title: "Жим гантелей сидячи (вгору)", tip: "План: 3 підходи по 10-12 повторень", eq: "Лава зі спинкою під кутом 80-90 градусів, дві гантелі.", pos: "Сидячи, щільно притисни поперек і лопатки до спинки лави. Гантелі на рівні вух.", tech: "Потужним рухом витискай гантелі вгору по дугоподібній траєкторії. Не блокуй лікті повністю у верхній точці. Плавно опускай снаряди до рівня вух або підборіддя." },
            db_bench_press: { title: "Жим гантелей лежачи", tip: "План: 4 підходи по 10-12 повторень", eq: "Горизонтальна лава, дві гантелі.", pos: "Лежачи на лаві, стопи жорстко впираються в підлогу. Лопатки максимально зведені.", tech: "Опускай гантелі до рівня грудей, тримаючи кут у ліктях близько 45-60 градусів від корпусу. Витискай гантелі вгору, зводячи їх над центром грудей." },
            pushups: { title: "Віджимання від підлоги", tip: "План: 4 підходи (30-25-25-20 повторень)", eq: "Власна вага тіла.", pos: "Упор лежачи. Руки розташовані трохи ширше плечей. Тіло утворює одну пряму лінію.", tech: "Опускайся до торкання підлоги грудьми. Лікті спрямовані назад под кутом 45 градусів від корпусу. Потужно виштовхуй себе вгору." },
            bench_dips: { title: "Віджимання від лави на трицепс", tip: "План: 4 підходи (30-25-25-20 повторень)", eq: "Лава або стілець.", pos: "Опора руками ззаду за край лави, ноги витягнуті вперед перед собою.", tech: "Опускай таз вниз уздовж лави, згинаючи лікті до кута 90 градусів. Лікті не повинні розходитися в сторони. Зусиллям трицепсів витискай себе вгору." },
            bb_row: { title: "Тяга штанги до пояса", tip: "План: 4 підходи по 12-15 повторень", eq: "Штанга, хват зверху або знизу трохи ширше плечей.", pos: "Нахил корпусу вперед приблизно на 45-60 градусів, коліна злегка зігнуті, спина ідеально пряма.", tech: "Тягни гриф штанги вздовж стегон до нижньої частини живота. Рух починається зі зведення лопаток і ведення ліктів назад-вгору." },
            bb_biceps_full: { title: "Підйом штанги на біцепс (повний)", tip: "План: 4 підходи по 10 повторень", eq: "Штанга з прямим або EZ-грифом. Хват знизу.", pos: "Стоячи рівно, плечі опущені, лікті щільно притиснуті до боків корпусу.", tech: "За рахунок сили біцепсів піднімай штангу вгору до рівня верхньої частини грудей. Лікті залишаються абсолютно нерухомими! Опускай штангу повільно та підконтрольно." },
            bb_biceps_half: { title: "Підйом штанги на біцепс (наполовину)", tip: "План: 4 підходи по 10 повторень", eq: "Штанга. Хват знизу на ширині плечей.", pos: "Стоячи рівно, лікті зафіксовані з боків тулуба.", tech: "Робота в частковій амплітуді. Рух виконується або в нижній половині (від стегон до паралелі з підлогою), або у верхній половині (від паралелі вгору до грудей)." },
            db_biceps_half: { title: "Підйом гантелей на біцепс (наполовину)", tip: "План: 4 підходи по 10 повторень", eq: "Дві гантелі.", pos: "Стоячи рівно або сидячи на лаві. Руки опущені, долоні спочатку розгорнуті всередину.", tech: "Піднімай гантелі до кута 90 градусів у ліктях, одночасно розгортаючи кисті долонями вгору (супінація). Робота в обмеженій амплітуді." },
            db_concentration_curl: { title: "Підйом гантелі на біцепс з упором в коліно", tip: "План: 4 підходи по 10-12 повторень", eq: "Одна гантель, стілець або лава.", pos: "Сидячи на лаві, ноги широко розставлені. Лікоть робочої руки впирається у внутрішню частину стегна.", tech: "Повністю ізольованим рухом згинайте руку з гантеллю в напрямку плеча. Корпус залишається нерухомим, працює виключно біцепс." },
            abs: { title: "Прес (скручування)", tip: "Опрацювання м'язів живота до відмови", eq: "Килимок для фітнесу.", pos: "Лежачи на спині, ноги зігнуті v колінах, стопи на підлозі. Руки тримай біля скронь.", tech: "За рахунок зусилля м'язів преса скручуй верхню частину корпусу вперед, відриваючи від підлоги лише лопатки. Поперек постійно притиснутий до підлоги." },

            one_arm_db_row: { title: "Тяга гантелі однією рукою в нахилі", tip: "План: 4 підходи по 12-15 повторень", eq: "Одна гантель, лава або надійна опора.", pos: "Одне коліно та долоня на лаві. Корпус паралельний підлозі. Рука з гантеллю опущена.", tech: "Тягни гантель у напрямку до стегна. Концентруйся на веденні ліктя вгору та максимальному притисканні його до тулуба. Зводь робочу лопатку." },

            db_triceps_extension: { title: "Підйом гантелі на трицепс з-за голови", tip: "План: 4 підходи по 10-12 повторень", eq: "Одна гантель, яку тримають обома руками під верхній внутрішній диск.", pos: "Сидячи на лаві або стоячи рівно. Руки з гантеллю випрямлені над головою.", tech: "Утримуючи лікті близько до голови, плавно опускай гантель за голову до повного згинання рук. Зусиллям трицепсів випрямляй руки вгору." }
        };

        // ТЕПЕР ВСЕ СУВОРО УНІФІКОВАНО В "ДЕНЬ 1", "ДЕНЬ 2"
        let appState = {
            activeProgramId: "prog_1",
            activeDayIndex: 0,
            programs: [
                {
                    id: "prog_1",
                    title: "Full Body Сила",
                    desc: "Гантелі + Штанга",
                    days: [
                        { name: "День 1", exercises: [] },
                        { name: "День 2", exercises: [] }
                    ]
                },
                {
                    id: "prog_2",
                    title: "Тільки гантелі",
                    desc: "Домашній пресет",
                    days: [
                        { name: "День 1", exercises: [] }
                    ]
                }
            ]
        };

        const STORAGE_KEY = "powerLog_v11_unified";
        let timerInterval = null;

        window.onload = function() {
            // Видалення попередніх версій, щоб застосувати уніфіковану назву днів
            localStorage.removeItem('powerLog_v10_appstore_style');

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                appState = JSON.parse(saved);
            }
            renderApp();
        };

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        function createNewProgram() {
            const name = prompt("Введи назву нової програми тренувань:");
            if (!name) return;
            const newId = "prog_" + Date.now();
            appState.programs.push({
                id: newId,
                title: name,
                desc: "Власна програма",
                days: [{ name: "День 1", exercises: [] }]
            });
            appState.activeProgramId = newId;
            appState.activeDayIndex = 0;
            saveState();
            renderApp();
        }

        function deleteProgram(id, event) {
            event.stopPropagation();
            if (appState.programs.length <= 1) {
                alert("Не можна видалити останню програму!");
                return;
            }
            if (confirm("Видалити цю програму разом з усіма днями вправ?")) {
                appState.programs = appState.programs.filter(p => p.id !== id);
                if (appState.activeProgramId === id) {
                    appState.activeProgramId = appState.programs[0].id;
                    appState.activeDayIndex = 0;
                }
                saveState();
                renderApp();
            }
        }

        function selectProgram(id) {
            appState.activeProgramId = id;
            appState.activeDayIndex = 0;
            renderApp();
        }

        function addNewDay() {
            const prog = appState.programs.find(p => p.id === appState.activeProgramId);
            if (prog) {
                const newDayNum = prog.days.length + 1;
                prog.days.push({ name: `День ${newDayNum}`, exercises: [] });
                appState.activeDayIndex = prog.days.length - 1;
                saveState();
                renderApp();
            }
        }

        function selectDay(index) {
            appState.activeDayIndex = index;
            renderApp();
        }

        function getCurrentDayObj() {
            const prog = appState.programs.find(p => p.id === appState.activeProgramId);
            if (prog && prog.days[appState.activeDayIndex]) {
                return prog.days[appState.activeDayIndex];
            }
            return null;
        }

        function addExercise() {
            const day = getCurrentDayObj();
            if (!day) return;

            const select = document.getElementById('exerciseSelect');
            const key = select.value;

            day.exercises.push({
                id: 'ex_' + Date.now(),
                key: key,
                showVisual: false,
                sets: [{ weight: 16, reps: 10, done: false }]
            });

            saveState();
            renderApp();
        }

        function removeExercise(id) {
            const day = getCurrentDayObj();
            if (!day) return;
            day.exercises = day.exercises.filter(ex => ex.id !== id);
            saveState();
            renderApp();
        }

        function addSet(exId) {
            const day = getCurrentDayObj();
            if (!day) return;
            const ex = day.exercises.find(e => e.id === exId);
            if (ex) {
                const last = ex.sets[ex.sets.length - 1];
                ex.sets.push({
                    weight: last ? last.weight : 16,
                    reps: last ? last.reps : 10,
                    done: false
                });
                saveState();
                renderApp();
            }
        }

        function updateSet(exId, setIndex, field, val) {
            const day = getCurrentDayObj();
            if (!day) return;
            const ex = day.exercises.find(e => e.id === exId);
            if (ex && ex.sets[setIndex]) {
                ex.sets[setIndex][field] = parseFloat(val) || val;
                saveState();
            }
        }

        function toggleVisual(exId) {
            const day = getCurrentDayObj();
            if (!day) return;
            const ex = day.exercises.find(e => e.id === exId);
            if (ex) {
                ex.showVisual = !ex.showVisual;
                saveState();
                renderApp();
            }
        }

        function toggleDone(exId, setIndex) {
            const day = getCurrentDayObj();
            if (!day) return;
            const ex = day.exercises.find(e => e.id === exId);
            if (ex && ex.sets[setIndex]) {
                ex.sets[setIndex].done = !ex.sets[setIndex].done;
                saveState();
                renderApp();

                if (ex.sets[setIndex].done) {
                    startTimer(90);
                }
            }
        }

        function clearCurrentDay() {
            const day = getCurrentDayObj();
            if (day && confirm("Очистити всі вправи для цього дня?")) {
                day.exercises = [];
                saveState();
                renderApp();
                stopTimer();
            }
        }

        // ФУНКЦІЇ СИНХРОНІЗАЦІЇ
        function exportData() {
            const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(appState))));
            navigator.clipboard.writeText(dataStr).then(() => {
                alert("Код твоїх тренувань успішно скопійовано! Надішли його собі на інший пристрій.");
            }).catch(err => {
                alert("Не вдалося скопіювати автоматично. Ось твій код:\n\n" + dataStr);
            });
        }

        function importData() {
            const code = prompt("Встав сюди раніше скопійований код даних:");
            if (!code) return;
            try {
                const decodedData = JSON.parse(decodeURIComponent(escape(atob(code))));
                if (decodedData && decodedData.programs) {
                    appState = decodedData;
                    saveState();
                    renderApp();
                    alert("Дані успішно імпортовано та синхронізовано!");
                } else {
                    alert("Помилка: Некоректний формат коду.");
                }
            } catch (e) {
                alert("Помилка: Не вдалося розпізнати код даних. Перевірте, чи правильно ви його скопіювали.");
            }
        }

        function renderApp() {
            const progContainer = document.getElementById('programsContainer');
            progContainer.innerHTML = '';
            
            appState.programs.forEach(p => {
                const isActive = p.id === appState.activeProgramId;
                progContainer.innerHTML += `
                    <div class="program-card ${isActive ? 'active' : ''}" onclick="selectProgram('${p.id}')">
                        <button class="btn-delete-program" onclick="deleteProgram('${p.id}', event)">🗑️</button>
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                        <p style="margin-top:8px; color: var(--accent-color); font-weight:600;">${p.days.length} трен. дні</p>
                    </div>
                `;
            });

            const currentProg = appState.programs.find(p => p.id === appState.activeProgramId);
            const daysTabsContainer = document.getElementById('daysTabsContainer');
            daysTabsContainer.innerHTML = '';

            if (currentProg) {
                currentProg.days.forEach((day, index) => {
                    const isActive = index === appState.activeDayIndex;
                    daysTabsContainer.innerHTML += `
                        <button class="day-tab ${isActive ? 'active' : ''}" onclick="selectDay(${index})">
                            ${day.name}
                        </button>
                    `;
                });
                daysTabsContainer.innerHTML += `<button class="btn-add-day" onclick="addNewDay()">+ Новий день</button>`;
            }

            const workoutContainer = document.getElementById('workoutContainer');
            workoutContainer.innerHTML = '';

            const activeDay = getCurrentDayObj();
            if (!activeDay || activeDay.exercises.length === 0) {
                workoutContainer.innerHTML = `<div style="text-align:center; color:#8d99ae; padding: 30px 15px; border: 1px dashed #2d3748; border-radius: 16px; font-size:14px; background-color: #151a21;">У цьому дні ще немає вправ.<br>Обери рух зі списку нижче і натисни "+ Вправу".</div>`;
                return;
            }

            activeDay.exercises.forEach(ex => {
                const db = exerciseDB[ex.key];
                if (!db) return;

                let setsHTML = '';
                ex.sets.forEach((set, sIdx) => {
                    setsHTML += `
                        <tr class="set-row">
                            <td>${sIdx + 1}</td>
                            <td><input type="number" class="input-field" value="${set.weight}" onchange="updateSet('${ex.id}', ${sIdx}, 'weight', this.value)"></td>
                            <td><input type="number" class="input-field" value="${set.reps}" onchange="updateSet('${ex.id}', ${sIdx}, 'reps', this.value)"></td>
                            <td style="text-align: right;">
                                <button class="btn-check ${set.done ? 'done' : ''}" onclick="toggleDone('${ex.id}', ${sIdx})">
                                    ${set.done ? '✓' : 'Done'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                workoutContainer.innerHTML += `
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <span class="exercise-title">${db.title}</span>
                            <div>
                                <button class="btn-delete" onclick="removeExercise('${ex.id}')">🗑️</button>
                                <button class="btn-info" onclick="toggleVisual('${ex.id}')">?</button>
                            </div>
                        </div>
                        <div class="exercise-tip">${db.tip}</div>

                        <div class="exercise-guide" style="display: ${ex.showVisual ? 'block' : 'none'}">
                            <div class="guide-item"><span class="guide-title">🛠️ Інвентар:</span> ${db.eq}</div>
                            <div class="guide-item"><span class="guide-title">🧘‍♂️ Вихідне положення:</span> ${db.pos}</div>
                            <div class="guide-item"><span class="guide-title">🎯 Техніка виконання:</span> ${db.tech}</div>
                        </div>

                        <table class="sets-table">
                            <thead>
                                <tr>
                                    <th>Сет</th>
                                    <th>Вага (кг)</th>
                                    <th>Повтори</th>
                                    <th style="text-align: right;">Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${setsHTML}
                            </tbody>
                        </table>
                        <button class="btn-add-set" onclick="addSet('${ex.id}')">+ Додати підхід</button>
                    </div>
                `;
            });
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            
            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    display.classList.add('alarm');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            display.innerText = "00:00";
        }

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
