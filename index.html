<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLog — Тренувальний Щоденник</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #95a5a6;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Запобігає злипанню блоків */
        }

        header {
            text-align: center;
            margin-bottom: 5px;
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .day-switcher {
            display: flex;
            background-color: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Адаптивна панель додавання */
        .add-exercise-panel {
            background-color: var(--card-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: row; /* На ПК в один ряд */
            gap: 10px;
        }

        select, .btn-main {
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            height: 46px;
            box-sizing: border-box;
        }

        select {
            flex-grow: 1;
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #444;
            width: 100%;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            min-width: 100px;
        }

        #workoutContainer {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Відступи між картками вправ */
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .exercise-title {
            font-size: 17px;
            font-weight: bold;
            line-height: 1.3;
        }

        .exercise-tip {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        .btn-info {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .exercise-guide {
            display: none;
            background-color: #151515;
            border-left: 3px solid var(--accent-color);
            padding: 12px;
            margin: 12px 0;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
        }

        .guide-item {
            margin-bottom: 8px;
        }

        .guide-item:last-child {
            margin-bottom: 0;
        }

        .guide-title {
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 2px;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .sets-table th {
            color: var(--text-muted);
            font-size: 12px;
            text-align: left;
            padding-bottom: 8px;
        }

        .set-row {
            border-top: 1px solid #2d2d2d;
        }

        .set-row td {
            padding: 8px 0;
        }

        .input-field {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            width: 55px;
            text-align: center;
            font-size: 14px;
        }

        .btn-check {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            min-width: 65px;
        }

        .btn-check.done {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .btn-add-set {
            background: none;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 2px solid var(--accent-color);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .timer-display {
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
        }
        
        .timer-display.alarm {
            color: var(--danger-color);
            animation: blink 1s infinite;
        }

        .timer-btn {
            background-color: var(--accent-color);
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear-all {
            background-color: #2a2a2a;
            color: var(--text-muted);
            border: 1px solid #444;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Мобільна адаптивність (Екрани менше 420px) */
        @media (max-width: 420px) {
            .add-exercise-panel {
                flex-direction: column; /* Список та кнопка стають один під одним */
            }
            .btn-main {
                width: 100%;
            }
            body {
                padding: 10px;
                padding-bottom: 140px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PowerLog</h1>

        </header>

        <div class="day-switcher">

        <div class="add-exercise-panel">

                    <option value="one_arm_db_row">Тяга гантелі однією рукою в нахилі</option>
                </optgroup>
                <optgroup label="Плечі та Трапеції">
                    <option value="db_shrugs">Шраги з гантелями</option>
                    <option value="db_seated_press">Жим гантелей сидячи</option>
                    <option value="db_front_raise">Підйом гантелей перед собою</option>
                    <option value="db_lateral_raise">Підйом гантелей в сторони</option>
                    <option value="bb_upright_row">Підйом штанги до грудей (Вертоліт)</option>
                </optgroup>
                <optgroup label="Руки (Біцепс/Трицепс)">
                    <option value="bb_biceps_full">Підйом штанги на біцепс (повний)</option>
                    <option value="bb_biceps_half">Підйом штанги на біцепс (наполовину)</option>
                    <option value="db_biceps_half">Підйом гантелей на біцепс (наполовину)</option>
                    <option value="db_concentration_curl">Підйом гантелі на біцепс з упором в коліно</option>
                    <option value="db_hammer_curl">"Молоток": підйом гантелей на біцепс</option>
                    <option value="bench_dips">Віджимання від лави (табурета) на трицепс</option>
                    <option value="db_triceps_extension">Підйом гантелі на трицепс з-за голови</option>
                </optgroup>
                <optgroup label="Коре">
                    <option value="abs">Прес</option>
                </optgroup>
            </select>
            <button class="btn-main" onclick="addExercise()">+ Додати</button>
        </div>

        <div id="workoutContainer"></div>
        
        <button class="btn-clear-all" onclick="clearCurrentDay()">Очистити цей день</button>
    </div>

    <div class="timer-panel">
        <div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Відпочинок</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>
        <button class="timer-btn" onclick="startTimer(60)">60 с</button>
        <button class="timer-btn" onclick="startTimer(90)">90 с</button>
        <button class="timer-btn" style="background-color: #333;" onclick="stopTimer()">Стоп</button>
    </div>

                tech: "Почергово або одночасно піднімай трохи зігнуті в ліктях руки вперед перед собою до рівня очей. Уникай розгойдування корпусу та допомоги ногами — рух виконує строго передня дельта."
            },
            db_lateral_raise: { 
                title: "Підйом гантелей в сторони", 
                tip: "План: 4 підходи по 12-15 повторень", 
                eq: "Дві легкі або середні гантелі.",
                pos: "Стоячи рівно, корпус злегка нахилений вперед (буквально на 5-10 градусів), гантелі утримуються перед стегнами.",
                tech: "Піднімай гантелі через сторони вгору. Рух ведеться ліктями, а не кистями (у верхній точці лікоть має бути на рівні плеча або трохи вище кисті, мізинець ніби розгортається вгору). Підйом виконується до рівня плечей."
            },
            bb_upright_row: { 
                title: "Підйом штанги до грудей 'Вертоліт'", 
                tip: "План: 4 підходи по 10 повторень", 
                eq: "Штанга, вузький або середній хват зверху.",
                pos: "Стоячи рівно, гриф штанги вільно лежить на стегнах.",
                tech: "Тягни штангу вертикально вгору вздовж тулуба до рівня підборіддя. Направляй рух ліктями — вони завжди мають першими йти вгору і бути вище грифу. Не піднімай плечі, концентруйся на середній дельті."
            },
            romanian_deadlift: { 
                title: "Станова тяга на прямих ногах", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Штанга або дві важкі гантелі.",
                pos: "Ноги на ширині стегон, стопи паралельні. Спина жорстко зафіксована з легким анатомічним прогином.",
                tech: "Починай рух строго з відведення тазу назад. Снаряд має буквально ковзати вздовж ніг. Опускайся приблизно до середини гомілки, відчуваючи сильне розтягнення задньої поверхні стегна. Повертайся у вихідне положення зусиллям сідниць."
            },
            db_flyes: { 
                title: "Розведення гантелей лежачи", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Горизонтальна лава, дві гантелі.",
                pos: "Лежачи на лаві, гантелі зведені над грудьми, долоні дивляться одна на одну (нейтральний хват). Лікті злегка зігнуті.",
                tech: "Плавно розводь гантелі в сторони по широкій дузі, відчуваючи розтягування грудних м'язів. Фіксуй кут у ліктях незмінним протягом усього руху! Повертай руки вгору по тій же траєкторії, ніби обіймаєш велике дерево."
            },
            one_arm_db_row: { 
                title: "Тяга гантелі однією рукою в нахилі", 
                tip: "План: 4 підходи по 12-15 повторень", 
                eq: "Одна гантель, лава або надійна горизонтальна опора.",
                pos: "Одне коліно та однойменна долоня фіксуються на лаві. Корпус паралельний підлозі. Інша нога на підлозі, рука з гантеллю опущена вниз.",
                tech: "Тягни гантель у напрямку до стегна або кишені (рух по дузі назад-вгору). Концентруйся на веденні ліктя вгору та максимальному притисканні його до тулуба. У верхній точці максимально зводь робочу лопатку."
            },
            db_hammer_curl: { 
                title: "«Молоток»: підйом гантелей", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Дві гантелі.",
                pos: "Стоячи рівно або сидячи на лаві. Руки витягнуті вздовж тіла, долоні спрямовані всередину до корпусу.",
                tech: "Піднімай гантелі вгору до плечей, зберігаючи нейтральний хват (долоні не розгортаються, вони дивляться одна на одну протягом усього підйому). Акцент на роботу плечопроменевого м'яза та біцепса."
            },
            db_triceps_extension: { 
                title: "Підйом гантелі на triцепс з-за голови", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Одна гантель, яку тримають обома руками під верхній внутрішній диск.",
                pos: "Сидячи на лаві або стоячи рівно. Руки з гантеллю випрямлені строго над головою.",
                tech: "Утримуючи лікті якомога ближче до голови (не дозволяй їм розходитися в сторони), плавно опускай гантель за голову до повного згинання рук. Зусиллям трицепсів потужно випрямляй руки вгору."
            }
        };

        let timerInterval = null;
        let currentDay = 'dayA'; 
        let globalState = { dayA: [], dayB: [] };

        // НОВИЙ СУПЕР-КЛЮЧ ДЛЯ ПОВНОГО СКИНУТИХ СТАРИХ ДАНИХ ТА ВЕРСТКИ
        const TARGET_KEY = 'powerLog_v9_final';

        window.onload = function() {
            // Зачищаємо абсолютно всі минулі версії
            localStorage.removeItem('powerLogWorkoutData_v5');
            localStorage.removeItem('powerLogWorkoutData_v6');
            localStorage.removeItem('powerLogWorkoutData_v7');
            localStorage.removeItem('powerLog_v8_descriptions');
            
            const savedData = localStorage.getItem(TARGET_KEY);
            if (savedData) {
                globalState = JSON.parse(savedData);
            }
            renderState();
        };

        function saveToLocalStorage() {
            localStorage.setItem(TARGET_KEY, JSON.stringify(globalState));
        }

        function switchDay(dayKey) {
            currentDay = dayKey;
            document.getElementById('btnDayA').classList.toggle('active', dayKey === 'dayA');
            document.getElementById('btnDayB').classList.toggle('active', dayKey === 'dayB');
            renderState();
        }

        function addExercise() {
            const select = document.getElementById('exerciseSelect');
            const exerciseKey = select.value;
            
            const newExercise = {
                id: 'ex_' + Date.now(),
                key: exerciseKey,
                showVisual: false,
                sets: [{ weight: 16, reps: 10, done: false }]
            };

            globalState[currentDay].push(newExercise);
            saveToLocalStorage();
            renderState();
        }

        function removeExercise(id) {
            globalState[currentDay] = globalState[currentDay].filter(ex => ex.id !== id);
            saveToLocalStorage();
            renderState();
        }

        function addSet(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                const lastSet = exercise.sets[exercise.sets.length - 1];
                exercise.sets.push({
                    weight: lastSet ? lastSet.weight : 16,
                    reps: lastSet ? lastSet.reps : 10,
                    done: false
                });
                saveToLocalStorage();
                renderState();
            }
        }

        function updateSetData(exerciseId, setIndex, field, value) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex][field] = parseFloat(value) || value;
                saveToLocalStorage();
            }
        }

        function toggleVisual(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                exercise.showVisual = !exercise.showVisual;
                saveToLocalStorage();
                renderState();
            }
        }

        function toggleSetDone(exerciseId, setIndex) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex].done = !exercise.sets[setIndex].done;
                saveToLocalStorage();
                renderState();

                if (exercise.sets[setIndex].done) {
                    startTimer(90); 
                }
            }
        }

        function clearCurrentDay() {
            if (confirm(`Очистити поточні записи для цього тренування?`)) {
                globalState[currentDay] = [];
                saveToLocalStorage();
                renderState();
                stopTimer();
            }
        }

        function renderState() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            const currentExercises = globalState[currentDay] || [];

            if (currentExercises.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 25px 15px; border: 1px dashed #444; border-radius: 8px; font-size:14px; background-color: var(--card-bg);">Список порожній.<br>Обери вправу зі свого плану вгорі та натисни "+ Додати".</div>`;
                return;
            }

            currentExercises.forEach(ex => {
                const dbData = exerciseDB[ex.key];
                if (!dbData) return;
                
                let setsHTML = '';
                ex.sets.forEach((set, index) => {
                    setsHTML += `
                        <tr class="set-row">
                            <td>${index + 1}</td>
                            <td><input type="number" class="input-field" value="${set.weight}" onchange="updateSetData('${ex.id}', ${index}, 'weight', this.value)"></td>
                            <td><input type="number" class="input-field" value="${set.reps}" onchange="updateSetData('${ex.id}', ${index}, 'reps', this.value)"></td>
                            <td style="text-align: right;">
                                <button class="btn-check ${set.done ? 'done' : ''}" onclick="toggleSetDone('${ex.id}', ${index})">
                                    ${set.done ? '✓' : 'Done'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                const cardHTML = `
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <span class="exercise-title">${dbData.title}</span>
                            <div>
                                <button class="btn-delete" onclick="removeExercise('${ex.id}')">🗑️</button>
                                <button class="btn-info" onclick="toggleVisual('${ex.id}')">?</button>
                            </div>
                        </div>
                        <div class="exercise-tip">${dbData.tip}</div>

                        <div class="exercise-guide" style="display: ${ex.showVisual ? 'block' : 'none'}">
                            <div class="guide-item"><span class="guide-title">🛠️ Інвентар:</span> ${dbData.eq}</div>
                            <div class="guide-item"><span class="guide-title">🧘‍♂️ Вихідне положення:</span> ${dbData.pos}</div>
                            <div class="guide-item"><span class="guide-title">🎯 Техніка виконання:</span> ${dbData.tech}</div>
                        </div>

                        <table class="sets-table">
                            <thead>
                                <tr>
                                    <th>Сет</th>
                                    <th>Вага (кг)</th>
                                    <th>Повтори</th>
                                    <th style="text-align: right;">Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${setsHTML}
                            </tbody>
                        </table>
                        <button class="btn-add-set" onclick="addSet('${ex.id}')">+ Додати підхід</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            
            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    display.classList.add('alarm');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            display.innerText = "00:00";
        }

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
