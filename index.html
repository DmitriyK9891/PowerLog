<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerLog — Тренувальний Щоденник</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #95a5a6;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .day-switcher {
            display: flex;
            background-color: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .add-exercise-panel {
            background-color: var(--card-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        select, .btn-main {
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        select {
            flex-grow: 1;
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #444;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .exercise-title {
            font-size: 17px;
            font-weight: bold;
            line-height: 1.3;
        }

        .exercise-tip {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        .btn-info {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* Оновлений блок технічного опису */
        .exercise-guide {
            display: none;
            background-color: #151515;
            border-left: 3px solid var(--accent-color);
            padding: 12px;
            margin: 12px 0;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
        }

        .guide-item {
            margin-bottom: 6px;
        }

        .guide-item:last-child {
            margin-bottom: 0;
        }

        .guide-title {
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .sets-table th {
            color: var(--text-muted);
            font-size: 12px;
            text-align: left;
            padding-bottom: 8px;
        }

        .set-row {
            border-top: 1px solid #2d2d2d;
        }

        .set-row td {
            padding: 8px 0;
        }

        .input-field {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            width: 55px;
            text-align: center;
            font-size: 14px;
        }

        .btn-check {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            min-width: 65px;
        }

        .btn-check.done {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .btn-add-set {
            background: none;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            width: 100%;
            padding: 6px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 2px solid var(--accent-color);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .timer-display {
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-color);
        }
        
        .timer-display.alarm {
            color: var(--danger-color);
            animation: blink 1s infinite;
        }

        .timer-btn {
            background-color: var(--accent-color);
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear-all {
            background-color: #333;
            color: var(--text-muted);
            border: 1px solid #444;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PowerLog</h1>
            <p>Твій тренувальний щоденник</p>
        </header>

        <div class="day-switcher">
            <button id="btnDayA" class="tab-btn active" onclick="switchDay('dayA')">Тренування 1</button>
            <button id="btnDayB" class="tab-btn" onclick="switchDay('dayB')">Тренування 2</button>
        </div>

        <div class="add-exercise-panel">
            <select id="exerciseSelect">
                <optgroup label="Ноги та Сідниці">
                    <option value="single_leg_lunges">Випади на одній нозі</option>
                    <option value="db_squats">Присідання з гантелями</option>
                    <option value="sumo_squat">Присідання сумо з однією гантеллю</option>
                    <option value="romanian_deadlift">Станова тяга на прямих ногах</option>
                </optgroup>
                <optgroup label="Груди та Спина">
                    <option value="db_bench_press">Жим гантелей лежачи</option>
                    <option value="pushups">Віджимання від підлоги</option>
                    <option value="db_flyes">Розведення гантелей лежачи</option>
                    <option value="bb_row">Тяга штанги до пояса</option>
                    <option value="one_arm_db_row">Тяга гантелі однією рукою в нахилі</option>
                </optgroup>
                <optgroup label="Плечі та Трапеції">
                    <option value="db_shrugs">Шраги з гантелями</option>
                    <option value="db_seated_press">Жим гантелей сидячи</option>
                    <option value="db_front_raise">Підйом гантелей перед собою</option>
                    <option value="db_lateral_raise">Підйом гантелей в сторони</option>
                    <option value="bb_upright_row">Підйом штанги до грудей (Вертоліт)</option>
                </optgroup>
                <optgroup label="Руки (Біцепс/Трицепс)">
                    <option value="bb_biceps_full">Підйом штанги на біцепс (повний)</option>
                    <option value="bb_biceps_half">Підйом штанги на біцепс (наполовину)</option>
                    <option value="db_biceps_half">Підйом гантелей на біцепс (наполовину)</option>
                    <option value="db_concentration_curl">Жим гантелі на біцепс з упором в коліно</option>
                    <option value="db_hammer_curl">"Молоток": підйом гантелей на біцепс</option>
                    <option value="bench_dips">Віджимання від лави (табурета) на трицепс</option>
                    <option value="db_triceps_extension">Підйом гантелі на трицепс</option>
                </optgroup>
                <optgroup label="Коре">
                    <option value="abs">Прес</option>
                </optgroup>
            </select>
            <button class="btn-main" onclick="addExercise()">+ Додати</button>
        </div>

        <div id="workoutContainer"></div>
        
        <button class="btn-clear-all" onclick="clearCurrentDay()">Очистити цей день</button>
    </div>

    <div class="timer-panel">
        <div>
            <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Відпочинок</div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>
        <button class="timer-btn" onclick="startTimer(60)">60 с</button>
        <button class="timer-btn" onclick="startTimer(90)">90 с</button>
        <button class="timer-btn" style="background-color: #333;" onclick="stopTimer()">Стоп</button>
    </div>

                pos: "Ноги на ширині стегон. Спина жорстко зафіксована з легким прогином.",
                tech: "Починай рух з відведення тазу назад (уявно закриваєш тазом двері). Снаряд ковзає вздовж ніг. Опускайся до середини гомілки, відчуваючи сильне розтягнення задньої поверхні стегна. Повертайся назад зусиллям сідниць."
            },
            db_flyes: { 
                title: "Розведення гантелей лежачи", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Горизонтальна лава, дві гантелі.",
                pos: "Лежачи, гантелі зведені над грудьми, долоні дивляться один на одного (нейтральний хват). Лікті ледь зігнуті.",
                tech: "Плавно розводь гантелі в сторони по широкій дузі, відчуваючи розтягування грудних м'язів. Кут у лікті залишається незмінним! Повертай руки вгору по тій же дузі, ніби обіймаєш велике дерево."
            },
            one_arm_db_row: { 
                title: "Тяга гантелі однією рукою в нахилі", 
                tip: "План: 4 підходи по 12-15 повторень", 
                eq: "Одна гантель, лава чи надійна опора.",
                pos: "Одне коліно та однойменна рука стоять на лаві. Корпус паралельний підлозі. Друга нога на підлозі, рука з гантеллю опущена.",
                tech: "Тягни гантель до стегна / кишені (рух по дузі назад-вгору). Концентруйся на веденні ліктя вгору і притисканні його до тулуба. Максимально зводь робочу лопатку."
            },
            db_hammer_curl: { 
                title: "«Молоток»: підйом гантелей", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Дві гантелі.",
                pos: "Стоячи або сидячи. Руки вздовж тіла, долоні спрямовані всередину до корпусу.",
                tech: "Піднімай гантелі вгору до плеча, зберігаючи нейтральний хват (долоні не розгортаються, дивляться одна на одну протягом усього руху). Працює плечопроменевий м'яз та біцепс."
            },
            db_triceps_extension: { 
                title: "Підйом гантелі на трицепс з-за голови", 
                tip: "План: 4 підходи по 10-12 повторень", 
                eq: "Одна гантель (тримається обома руками під верхній диск).",
                pos: "Сидячи (бажано з низькою спинкою) або стоячи. Руки з гантеллю випрямлені над головою.",
                tech: "Утримуючи лікті близько до голови (не дозволяй їм розходитися в сторони), плавно опускай гантель за голову до повного згинання рук. Зусиллям трицепсів випрямляй руки вгору."
            }
        };

        let timerInterval = null;
        let currentDay = 'dayA'; 
        
        let globalState = { dayA: [], dayB: [] };

        window.onload = function() {
            // Ключ оновлено до версії v7, щоб гарантовано завантажити нову структуру
            const savedData = localStorage.getItem('powerLogWorkoutData_v7');
            if (savedData) {
                globalState = JSON.parse(savedData);
            }
            renderState();
        };

        function saveToLocalStorage() {
            localStorage.setItem('powerLogWorkoutData_v7', JSON.stringify(globalState));
        }

        function switchDay(dayKey) {
            currentDay = dayKey;
            document.getElementById('btnDayA').classList.toggle('active', dayKey === 'dayA');
            document.getElementById('btnDayB').classList.toggle('active', dayKey === 'dayB');
            renderState();
        }

        function addExercise() {
            const select = document.getElementById('exerciseSelect');
            const exerciseKey = select.value;
            
            const newExercise = {
                id: 'ex_' + Date.now(),
                key: exerciseKey,
                showVisual: false,
                sets: [{ weight: 16, reps: 10, done: false }]
            };

            globalState[currentDay].push(newExercise);
            saveToLocalStorage();
            renderState();
        }

        function removeExercise(id) {
            globalState[currentDay] = globalState[currentDay].filter(ex => ex.id !== id);
            saveToLocalStorage();
            renderState();
        }

        function addSet(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                const lastSet = exercise.sets[exercise.sets.length - 1];
                exercise.sets.push({
                    weight: lastSet ? lastSet.weight : 16,
                    reps: lastSet ? lastSet.reps : 10,
                    done: false
                });
                saveToLocalStorage();
                renderState();
            }
        }

        function updateSetData(exerciseId, setIndex, field, value) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex][field] = parseFloat(value) || value;
                saveToLocalStorage();
            }
        }

        function toggleVisual(exerciseId) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise) {
                exercise.showVisual = !exercise.showVisual;
                saveToLocalStorage();
                renderState();
            }
        }

        function toggleSetDone(exerciseId, setIndex) {
            const exercise = globalState[currentDay].find(ex => ex.id === exerciseId);
            if (exercise && exercise.sets[setIndex]) {
                exercise.sets[setIndex].done = !exercise.sets[setIndex].done;
                saveToLocalStorage();
                renderState();

                if (exercise.sets[setIndex].done) {
                    startTimer(90); 
                }
            }
        }

        function clearCurrentDay() {
            if (confirm(`Очистити поточні записи для цього тренування?`)) {
                globalState[currentDay] = [];
                saveToLocalStorage();
                renderState();
                stopTimer();
            }
        }

        function renderState() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            const currentExercises = globalState[currentDay] || [];

            if (currentExercises.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:30px; font-size:14px; border: 1px dashed #333; padding: 20px; border-radius: 8px;">Список порожній.<br>Обери вправу зі свого плану вгорі та натисни "+ Додати".</div>`;
                return;
            }

            currentExercises.forEach(ex => {
                const dbData = exerciseDB[ex.key];
                if (!dbData) return;
                
                let setsHTML = '';
                ex.sets.forEach((set, index) => {
                    setsHTML += `
                        <tr class="set-row">
                            <td>${index + 1}</td>
                            <td><input type="number" class="input-field" value="${set.weight}" onchange="updateSetData('${ex.id}', ${index}, 'weight', this.value)"></td>
                            <td><input type="number" class="input-field" value="${set.reps}" onchange="updateSetData('${ex.id}', ${index}, 'reps', this.value)"></td>
                            <td style="text-align: right;">
                                <button class="btn-check ${set.done ? 'done' : ''}" onclick="toggleSetDone('${ex.id}', ${index})">
                                    ${set.done ? '✓' : 'Done'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                const cardHTML = `
                    <div class="exercise-card">
                        <div class="exercise-header">
                            <span class="exercise-title">${dbData.title}</span>
                            <div>
                                <button class="btn-delete" onclick="removeExercise('${ex.id}')">🗑️</button>
                                <button class="btn-info" onclick="toggleVisual('${ex.id}')">?</button>
                            </div>
                        </div>
                        <div class="exercise-tip">${dbData.tip}</div>

                        <div class="exercise-guide" id="guide_${ex.id}" style="display: ${ex.showVisual ? 'block' : 'none'}">
                            <div class="guide-item"><span class="guide-title">🛠️ Інвентар:</span> ${dbData.eq}</div>
                            <div class="guide-item"><span class="guide-title">🧘‍♂️ Вихідне положення:</span> ${dbData.pos}</div>
                            <div class="guide-item"><span class="guide-title">🎯 Техніка виконання:</span> ${dbData.tech}</div>
                        </div>

                        <table class="sets-table">
                            <thead>
                                <tr>
                                    <th>Сет</th>
                                    <th>Вага (кг)</th>
                                    <th>Повтори</th>
                                    <th style="text-align: right;">Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${setsHTML}
                            </tbody>
                        </table>
                        <button class="btn-add-set" onclick="addSet('${ex.id}')">+ Додати підхід</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            
            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    display.classList.add('alarm');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const display = document.getElementById('timerDisplay');
            display.classList.remove('alarm');
            display.innerText = "00:00";
        }

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
